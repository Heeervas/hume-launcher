schema_version: "1.0"
policy_id: hume-madrid-quality
minimum_quality_expected: standard
change_scope:
  default: all
  include_untracked: true
  detect_file_renames: true
scope:
  include: []
  exclude: ["**/vendor/**", "**/generated/**", "**/dist/**", "**/coverage/**"]
  languages: []
baseline:
  strategy: merge_base
  ref: 19bd8b1fa2d535929c768e6e197a9f464e89f953
  unavailable: error
adapters:
  - id: core-source
    type: builtin
    implementation: core_source_v1
    languages: []
    required_at: soft
  - id: python-ast
    type: builtin
    implementation: python_ast_v1
    languages: [python]
    required_at: standard
  - id: external-findings
    type: external_json
    implementation: external_findings_v1
    paths: [.agents/pmd-findings.json]
    languages: [java]
    required_at: standard
  - id: oxlint-complexity
    type: external_json
    implementation: external_metrics_v2
    paths: [.agents/oxlint-metrics.json]
    languages: [javascript, typescript]
    required_at: standard
thresholds:
  python_ast_v1.function_logical_lines: {warning: 40, strong: 80}
  python_ast_v1.cyclomatic_v1: {warning: 10, strong: 15}
  python_ast_v1.max_nesting: {warning: 4, strong: 6}
  python_ast_v1.parameter_count: {warning: 5, strong: 8}
  python_ast_v1.file_logical_lines: {warning: 500, strong: 900}
  oxlint_v1.cyclomatic: {warning: 10, strong: 15}
policy:
  changed_code_only: true
  untouched_existing_debt: report
  soft_new_strong: report
  standard_new_strong: exception_or_fail
  top_new_strong: exception_or_fail
  required_adapter_failure: incomplete
exceptions: []
extensions: {}
